[project]
name = "background-evolution-client"
version = "0.1.0"
description = "Pygame desktop client for Background Evolution"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pygame = "^2.6"
pillow = "^11.0"
pystray = "^0.19"
requests = "^2.32"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
responses = "^0.25"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
