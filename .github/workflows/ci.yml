name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check backend client
      - run: ruff format --check backend client

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: background_evolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/background_evolution_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/background_evolution_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --with test
        working-directory: backend
      - run: poetry run alembic upgrade head
        working-directory: backend
      - run: poetry run pytest tests/
        working-directory: backend

  client-tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --with test
        working-directory: client
      # platform_win32/ (Win32 tray + window-chrome hooking) is intentionally
      # excluded: it's Windows-only, pystray doesn't import cleanly headless
      # on Linux, and none of the tests here touch it - see client/tests/.
      - run: poetry run pytest tests/
        working-directory: client

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, backend-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/backend.Dockerfile .
      # No registry push configured yet - add a `docker/login-action` step
      # plus `docker push` here once a registry (GHCR is the obvious
      # low-friction default for a GitHub-hosted repo) is decided.
