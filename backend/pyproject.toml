[tool.poetry]
name = "background-evolution-backend"
version = "0.1.0"
description = "Backend API + game engine for Background Evolution"
authors = ["Sandro Kvatashidze <sandrokvatashidze@gmail.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic = "^2.9"
pydantic-settings = "^2.5"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
